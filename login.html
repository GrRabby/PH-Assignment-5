<!DOCTYPE html>
<html data-theme="light" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./styles/stylesheet.css">
  <style>
    .main-container {
        animation:cardIn 0.65s;
    }
    @keyframes cardIn {
        from {  opacity:0;
                transform:translateY(40px); 
        }
        to   {  opacity:1;
                transform:translateY(0); 
        }
    }
    .main-container::before {
        content: '';
        position: absolute;
        inset: 10px 16px -24px 16px;
        border-radius: 2.5rem;
        background: linear-gradient(135deg, #7c3aed, #ec4899, #60a5fa, #a855f7, #f97316, #7c3aed);
        background-size: 400% 400%;
        opacity: 0.45;
        filter: blur(30px);
        z-index: -1;
        animation: gradientShift 2s ease infinite, glowPulse 2s ease-in-out infinite alternate;
    }
    @keyframes gradientShift {
        0%   { background-position: 0% 50%; }
        50%  { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
    @keyframes glowPulse {
        from { opacity: 0.35; 
            filter: blur(26px); 
            transform: scale(0.97) translateY(0px); 
        }
        to   { opacity: 0.55; 
            filter: blur(40px); 
            transform: scale(1.03) translateY(6px); 
        }
    }

    .login-card > * { animation:fadeUp 0.5s both; }
    .login-card > *:nth-child(1) { animation-delay:0.08s; }
    .login-card > *:nth-child(2) { animation-delay:0.14s; }
    .login-card > *:nth-child(3) { animation-delay:0.20s; }
    .login-card > *:nth-child(4) { animation-delay:0.26s; }
    .login-card > *:nth-child(5) { animation-delay:0.32s; }
    .login-card > *:nth-child(6) { animation-delay:0.38s; }
    .login-card > *:nth-child(7) { animation-delay:0.44s; }
    .login-card > *:nth-child(8) { animation-delay:0.50s; }
    @keyframes fadeUp {
        from { opacity:0;transform:translateY(14px); }
        to   { opacity:1;transform:translateY(0); }
    }
    .fields-panel-wrap::before {
        content: '';
        position: absolute;
        inset: -6px -8px -14px -8px;
        border-radius: 1.75rem;
        background: linear-gradient(135deg, #a78bfa 0%, #ec4899 50%, #60a5fa 100%);
        opacity: 0.18;
        filter: blur(14px);
        z-index: 0;
        transition: opacity 0.35s, filter 0.35s, inset 0.35s;
    }
    .fields-panel-wrap:focus-within::before {
        opacity: 0.42;
        filter: blur(20px);
        inset: -10px -12px -20px -12px;
    }
    .field-icon {
        position: absolute;
        left: 16px;
        color: #c4b5fd;
        transition: color 0.2s;
    }
    .field-row:focus-within .field-icon { 
        color: #7c3aed; 
    }

    .field-label {
        position: absolute;
        left: 46px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 0.82rem;
        font-weight: 600;
        color: #a78bfa;
        pointer-events: none;
        transition: all 0.18s;
        letter-spacing: 0.01em;
    }
    .field-input {
        width: 100%;
        height: 58px;
        padding: 18px 1rem 6px 46px;
        border: none;
        background: transparent;
        font-size: 0.95rem;
        color: #1e293b;
        outline: none;
    }
    .field-input { 
        padding-right: 3rem; 
    }
    .field-input:focus ~ .field-label,
    .field-input:not(:placeholder-shown) ~ .field-label {
        top: 14px;
        font-size: 0.68rem;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        color: #7c3aed;
    }
    .btn-submit::before {
        content:'';
        position:absolute;
        inset:0;
        background:linear-gradient(135deg,rgba(255,255,255,0.18),transparent);
        opacity:0;transition:opacity 0.2s;
    }
    .btn-submit:hover { 
        box-shadow:0 8px 28px rgba(124,58,237,0.38); }
    .or-divider::before,.or-divider::after {
        content:'';
        flex:1;
        height:1px;
        background:#e2e8f0;
    }

  </style>
</head>
<body class="min-h-lvh bg-[#F8FAFC] flex items-center justify-center">
  <div class="main-container mt-12 relative z-10 w-full max-w-[440px] animate-[cardIn] shadow-[0_0_0_1px_rgba(120,80,255,0.07),0_8px_16px_rgba(120,80,255,0.06),0_32px_64px_rgba(100,60,200,0.10)] rounded-[2rem]">
    <div class="card-header bg-[linear-gradient(135deg,#f5f3ff_0%,#fdf2f8_60%,#eff6ff_100%)] w-full pt-8 rounded-tr-[2rem] rounded-tl-[2rem] border-b border-b-[rgba(91,60,245,0.08)]">
        <div class="flex flex-col justify-center items-center mb-6">
            <img src="./assets/github-logo.png" alt="" class="w-fit h-fit mb-3">
            <h1 class="font-semibold text-[24px]">GitHub Issues Tracker</h1>
            <p class="text-[16px] text-[#64748B]">Sign in to manage your issues</p>
        </div>
    </div>

    <div class="login-card bg-white p-10 rounded-br-[2rem] rounded-bl-[2rem]">
      <div class="fields-panel-wrap relative mb-4">
        <div class="fields-panel mb-6 shadow-[0_1px_3px_rgba(124,58,237,0.05),inset_0_1px_0_rgba(255,255,255,0.95)] relative z-1 bg-[linear-gradient(145deg,#fdfcff_0%,#f8fafc_100%)] rounded-[1.25rem] border-[1.5px] overflow-hidden border-[rgba(196,181,253,0.55)] transition-[border-color,box-shadow] duration-200">
            <div class="field-row relative flex items-center">
                <p class="field-icon">
                    <i class="fa-solid fa-user"></i></i>
                </p>
                <input type="text" placeholder=" " class="field-input" id="userInput" />
                <label class="field-label" for="userInput">Username</label>
            </div>
            <div class="field-row relative flex items-center border-t-[1.5px] border-t-[#ede9fe]">
                <p class="field-icon">
                    <i class="fa-solid fa-lock"></i>
                </p>
                <div class="relative flex items-center w-full">
                    <input type="password" placeholder=" " class="field-input" id="pwInput" />
                    <label class="field-label" for="pwInput">Password</label>
                    <button class="absolute right-[14px] top-[50%] translate-y-[-50%] z-1" onclick="togglePw()" id="eyeBtn" type="button">
                        <i class="fa-solid fa-eye" id="eyeIcon" style="color: rgb(215, 205, 254);"></i>
                    </button>
                </div>
            </div>
        </div>
      </div>

      <button class="btn-submit mb-6 shadow-[0_4px_18px_rgba(124,58,237,0.3)] transition-all duration-[0.15s] overflow-hidden text-white w-full h-[50px] rounded-[15px] border-none cursor-pointer bg-[linear-gradient(135deg,#7c3aed_0%,#a855f7_50%,#ec4899_100%)]" onclick="handleLogin(this)" type="button">Sign In <i class="fa-solid fa-arrow-right-to-bracket"></i></button>
      <div class="or-divider mb-6 uppercase flex items-center gap-3 text-[#cbd5e1] text-[12px] font-semibold">or</div>
      <div class="text-center w-full flex flex-col items-center justify-center gap-2">
        <p class="text-[14px] text-[#64748B]">Demo Credentials</p>
        <div class="w-full bg-[linear-gradient(135deg,#f5f3ff_0%,#fdf2f8_60%,#eff6ff_100%)] p-6 rounded-[2rem]">
            <p><span class="font-bold">Username:</span> admin</p>
            <p><span class="font-bold">Password:</span> admin123</p>
        </div>
      </div>

    </div>
  </div>

  <script>
    function togglePw() {
      const inp = document.getElementById('pwInput');
      const icon = document.getElementById('eyeIcon');
      if (inp.type === 'password') {
        inp.type = 'text'; 
        icon.classList = ''
        icon.classList = "fa-solid fa-eye-slash"
      } else {
        inp.type = 'password'; 
        icon.classList = ''
        icon.classList = "fa-solid fa-eye"
      }
    }

    function handleLogin(btn) {
      btn.innerHTML = '<span class="loading loading-spinner loading-sm" style="margin-right:6px;"></span> Signing in…';
      btn.disabled = true;
      setTimeout(() => {
        btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px;display:inline"><polyline points="20 6 9 17 4 12"/></svg> Signed in!';
        btn.style.background = 'linear-gradient(135deg,#22c55e,#16a34a)';
        btn.style.boxShadow = '0 4px 18px rgba(34,197,94,0.35)';
        setTimeout(() => {
          btn.innerHTML = 'Sign In <i class="fa-solid fa-arrow-right-to-bracket"></i>';
          btn.style.background = ''; btn.style.boxShadow = '';
          btn.disabled = false;
        }, 2500);
      }, 1500);
    }
  </script>
</body>
</html>
